<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Alcôve</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1a1521"><link rel="icon" href="icon-192.png">
<style>
:root{--bg:#1a1521;--card:#241d2e;--ink:#f1ecf6;--mut:#9d92ab;--ac:#e0a458}
@media(prefers-color-scheme:light){:root{--bg:#ece7f1;--card:#f8f5fb;--ink:#211a2b;--mut:#6f6580}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;padding:env(safe-area-inset-top) 16px calc(84px + env(safe-area-inset-bottom))}
h1,h2,h3,.big{font-family:'Iowan Old Style',Palatino,Georgia,'Noto Serif',serif;font-weight:600;line-height:1.15}
h1{font-size:2rem;padding:20px 0 4px}h2{font-size:1.3rem;margin:26px 0 10px}
.mut{color:var(--mut);font-size:.9rem}
.niche{background:radial-gradient(ellipse at 50% 100%,color-mix(in srgb,var(--ac) 38%,transparent),transparent 70%),var(--card);border-radius:999px 999px 22px 22px;padding:56px 22px 26px;text-align:center;margin-top:14px;box-shadow:0 0 0 1px color-mix(in srgb,var(--ac) 45%,transparent)}
.niche svg{width:120px;height:120px;stroke:var(--ink);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.niche .big{font-size:2.4rem;margin:8px 0 2px;letter-spacing:.04em}
.pal{display:flex;gap:8px}.pal i{flex:1;aspect-ratio:1/1.5;border-radius:999px 999px 10px 10px}
.bar{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;margin:6px 0;font-size:.9rem}
.bar span{height:8px;border-radius:4px;background:color-mix(in srgb,var(--ink) 12%,transparent);overflow:hidden}.bar b{display:block;height:100%;background:var(--ac)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips u{text-decoration:none;background:var(--card);border-radius:14px;padding:3px 11px;font-size:.88rem}
.chips u em{color:var(--ac);font-style:normal;margin-left:5px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats div{background:var(--card);border-radius:14px;padding:12px 6px;text-align:center}.stats .big{font-size:1.6rem;display:block}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
figure img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:999px 999px 8px 8px;background:var(--card);display:block}
figure i{display:flex;height:5px;margin:4px 10px 0;border-radius:3px;overflow:hidden}figure i b{flex:1}figcaption{text-align:center;font-size:.78rem;color:var(--mut)}
.card{background:var(--card);border-radius:18px;padding:18px;margin-top:14px}
button,label.btn,input,select{font:inherit;color:inherit}
button,label.btn{display:block;width:100%;background:var(--ac);color:#1a1521;border:0;border-radius:14px;padding:12px;margin-top:10px;text-align:center;font-weight:600;cursor:pointer}
button.alt{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--mut)}
input[type=text]{width:100%;background:transparent;border:0;box-shadow:inset 0 0 0 1px var(--mut);border-radius:12px;padding:11px;margin-top:8px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:4px}
nav button{margin:0;background:none;color:var(--mut);padding:12px 4px}nav button.on{color:var(--ink);box-shadow:inset 0 -3px var(--ac);border-radius:0}
</style></head><body>
<h1>Alcôve</h1><p class="mut" id="sub"></p><main id="m"></main>
<nav><button data-t="p" class="on">Profil</button><button data-t="g">Pièces</button><button data-t="d">Données</button></nav>
<script>
const $=s=>document.querySelector(s);
const DB=new Promise(r=>{const q=indexedDB.open('alcove',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>r(q.result)});
const kv=async(m,k,v)=>{const db=await DB;return new Promise(r=>{const s=db.transaction('kv',m=='get'?'readonly':'readwrite').objectStore('kv');const q=m=='get'?s.get(k):s.put(v,k);q.onsuccess=()=>r(q.result)})};
let S={items:{},outfits:{}},T='p',lastBk=0;
const save=()=>Promise.all([kv('put','items',S.items),kv('put','outfits',S.outfits)]);
const rgb=c=>`rgb(${c[0]},${c[1]},${c[2]})`;
const load=src=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src});
async function pal(src){const i=await load(src);if(!i)return[];const c=document.createElement('canvas');c.width=c.height=32;const x=c.getContext('2d');x.drawImage(i,0,0,32,32);const d=x.getImageData(0,0,32,32).data,b={};
for(let p=0;p<d.length;p+=4){const r=d[p],g=d[p+1],l=d[p+2];if(d[p+3]<128)continue;const mx=Math.max(r,g,l),mn=Math.min(r,g,l);if(mn>225||(mx-mn<12&&mx>215))continue;const k=[r,g,l].map(v=>v>>5).join();const a=b[k]||(b[k]=[0,0,0,0]);a[0]+=r;a[1]+=g;a[2]+=l;a[3]++}
return Object.values(b).sort((a,c)=>c[3]-a[3]).slice(0,3).map(a=>[a[0]/a[3]|0,a[1]/a[3]|0,a[2]/a[3]|0,a[3]])}
async function thumb(src){const i=await load(src);const c=document.createElement('canvas');c.width=180;c.height=240;c.getContext('2d').drawImage(i,0,0,180,240);return c.toDataURL('image/webp',.8)}
const hs=([r,g,b])=>{r/=255;g/=255;b/=255;const m=Math.max(r,g,b),n=Math.min(r,g,b),l=(m+n)/2,d=m-n;let h=0;if(d){h=m==r?((g-b)/d)%6:m==g?(b-r)/d+2:(r-g)/d+4;h=(h*60+360)%360}return[h,d?d/(1-Math.abs(2*l-1)):0]};
const LB={ete:'Été',heritage:'Héritage',donne:'Donné',achete:'Acheté',decouvert:'Découvert','epaules-nues':'Épaules nues',decollete:'Décolleté',recoudre:'À recoudre',tache:'Taché',ecru:'Écru',vegetal:'Végétal',geometrique:'Géométrique',synthetique:'Synthétique',figuratif:'Figuratif',noeud:'Nœud'};
const SKIP='haut bas une-piece couche exterieur chaussures accessoires ch-ouvertes ch-fermees ch-informelles autres sous-vetements'.split(' ');
const lab=t=>LB[t]||(t[0].toUpperCase()+t.slice(1).replace(/-/g,' '));
const MOT='fleuri vegetal rayures geometrique figuratif noeud'.split(' ');
function stats(){const I=Object.values(S.items),O=Object.values(S.outfits);if(!I.length)return null;
const sh=f=>I.filter(f).length/I.length,acc={};let W=0,warm=0,sat=0;
I.forEach(i=>i.colors.forEach(c=>{const w=c[3]*(1+i.wears),k=c.slice(0,3).map(v=>v>>6).join(),a=acc[k]||(acc[k]=[0,0,0,0]),[h,s]=hs(c);a[0]+=c[0]*w;a[1]+=c[1]*w;a[2]+=c[2]*w;a[3]+=w;W+=w;sat+=s*w;if(h<70||h>320)warm+=w}));
const palette=Object.values(acc).sort((a,b)=>b[3]-a[3]).slice(0,6).map(a=>[a[0]/a[3]|0,a[1]/a[3]|0,a[2]/a[3]|0]);
const tg={};I.forEach(i=>i.tags.forEach(t=>SKIP.includes(t)||(tg[t]=(tg[t]||0)+1)));
const ppo=O.length?O.reduce((s,o)=>s+o.pieces.length,0)/O.length:3,cl=v=>Math.max(0,Math.min(1,v));
return{n:I.length,o:O.length,palette,tags:Object.entries(tg).sort((a,b)=>b[1]-a[1]).slice(0,12),once:I.filter(i=>i.wears<2).length,
ax:[sh(i=>i.wears>=2),cl((ppo-2)/3),sh(i=>i.tags.includes('heritage')||i.tags.includes('donne')),W?warm/W:.5,cl(.5*sh(i=>MOT.some(t=>i.tags.includes(t)))*2+.5*(W?sat/W:0))]}}
const AXL=['Ordre','Modularité','Héritage','Chaleur','Audace'];
const F={BILLY:'<rect x="24" y="8" width="52" height="84"/><path d="M24 36h52M24 64h52"/>',
KALLAX:'<rect x="12" y="12" width="76" height="76"/><path d="M37 12v76M62 12v76M12 37h76M12 62h76"/>',
'POÄNG':'<path d="M30 12c-8 22-8 42 4 60h34M30 12c14 8 26 24 30 50M34 72l-6 18M68 72l6 18"/>',
EKTORP:'<rect x="10" y="40" width="80" height="34" rx="10"/><path d="M18 40V26q0-8 8-8h48q8 0 8 8v14M20 74v10M80 74v10"/>',
STOCKHOLM:'<rect x="8" y="30" width="84" height="40" rx="3"/><path d="M36 70V30M64 70V30M14 70l-3 20M86 70l3 20"/><circle cx="32" cy="50" r="2"/><circle cx="68" cy="50" r="2"/>',
LACK:'<rect x="14" y="30" width="72" height="10" rx="2"/><path d="M22 40v46M78 40v46"/>'};
const AR={BILLY:[[.8,.5,.3,.4,.2],'Rangé·e, fiable, jamais à court d’étagères.','H 202 × L 80 cm · montage : 1 h'],
KALLAX:[[.6,.9,.3,.5,.5],'Tout se combine, tout se range en cases.','H 147 × L 147 cm · montage : 2 h'],
'POÄNG':[[.4,.3,.6,.6,.4],'Une courbe douce, un endroit où se poser.','H 100 × L 68 cm · montage : 40 min'],
EKTORP:[[.5,.4,.8,.7,.3],'Chaleur, héritage et coussins qui ont vécu.','H 88 × L 218 cm · montage : 1 h 30'],
STOCKHOLM:[[.4,.4,.4,.5,.9],'Une pièce de caractère, jamais anonyme.','H 74 × L 180 cm · montage : 3 h, clé Allen fournie'],
LACK:[[.3,.7,.1,.2,.1],'Sobre, léger, s’adapte à tout.','H 45 × L 55 cm · montage : 10 min']};
function pick(ax){return Object.entries(AR).map(([n,a])=>[n,a[0].reduce((s,v,j)=>s+(v-ax[j])**2,0)]).sort((a,b)=>a[1]-b[1])[0][0]}
function view(){const m=$('#m'),s=stats();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==T));
if(s)document.documentElement.style.setProperty('--ac',rgb(s.palette[0]));
$('#sub').textContent=s?`${s.n} pièces · ${s.o} tenues`:'Votre étagère culturelle';
if(T=='d')return m.innerHTML=data();
if(!s)return m.innerHTML='<div class="card"><h2>Bienvenue</h2><p>Importez l’export JSON de votre garde-robe dans l’onglet Données pour voir votre profil.</p></div>';
if(T=='g')return m.innerHTML='<div class="grid">'+Object.values(S.items).sort((a,b)=>b.wears-a.wears).map(i=>`<figure><img src="${i.thumb}" alt=""><i>${i.colors.map(c=>`<b style="background:${rgb(c)}"></b>`).join('')}</i><figcaption>${i.wears}×${i.src=='manuel'?' ✎':''}</figcaption></figure>`).join('')+'</div>';
const k=pick(s.ax);
m.innerHTML=`<div class="niche"><svg viewBox="0 0 100 100">${F[k]}</svg><p class="mut">Votre meuble</p><div class="big">${k}</div><p>${AR[k][1]}</p><p class="mut" style="margin-top:6px">${AR[k][2]}</p><button id="sh" style="max-width:220px;margin:16px auto 0">Partager</button></div>
<h2>Votre palette</h2><div class="pal">${s.palette.map(c=>`<i style="background:${rgb(c)}"></i>`).join('')}</div>
<h2>Votre profil</h2>${AXL.map((l,j)=>`<div class="bar">${l}<span><b style="width:${Math.round(s.ax[j]*100)}%"></b></span></div>`).join('')}
<h2>Ce qui revient</h2><div class="chips">${s.tags.map(([t,n])=>`<u>${lab(t)}<em>${n}</em></u>`).join('')}</div>
<h2>En chiffres</h2><div class="stats"><div><span class="big">${s.n}</span>pièces</div><div><span class="big">${s.once}</span>portées 0-1 fois</div><div><span class="big">${s.o}</span>tenues</div></div>`;
$('#sh').onclick=()=>{const t=`Mon meuble Ikea : ${k} — ${AR[k][1]} (Alcôve)`;navigator.share?navigator.share({text:t}):navigator.clipboard.writeText(t)}}
function data(){const old=lastBk&&Date.now()-lastBk>2.6e9;return`<div class="card"><h3>Importer la garde-robe</h3><p class="mut">Export JSON de votre outil. Les pièces déjà connues sont fusionnées, rien n’est supprimé.</p><label class="btn">Choisir le fichier<input type="file" accept=".json" id="f" hidden></label><p class="mut" id="msg"></p></div>
<div class="card"><h3>Ajouter une pièce</h3><input type="text" id="tg" placeholder="Tags séparés par des virgules (ex. robe, bleu, lin)"><label class="btn alt">Photo<input type="file" accept="image/*" capture="environment" id="ph" hidden></label></div>
<div class="card"><h3>Sauvegarde</h3><p class="mut">${lastBk?(old?'Dernière sauvegarde il y a plus d’un mois.':'Dernière sauvegarde : '+new Date(lastBk).toLocaleDateString('fr')):'Aucune sauvegarde encore.'} Vos données ne vivent que sur ce téléphone.</p><button id="bk">Sauvegarder</button></div>`}
const msg=t=>{const e=$('#msg');if(e)e.textContent=t};
async function imp(file){try{msg('Lecture…');const d=JSON.parse(await file.text());
if(d.alcove){S=d.alcove;await save();T='p';return view()}
const it=d.items||[];let n=0;
for(const o of it){const old=S.items[o.id];S.items[o.id]={id:o.id,tags:o.tags||[],wears:o.wears||0,wearDates:o.wearDates||[],thumb:o.thumb||await thumb(o.photo),colors:old&&old.colors.length?old.colors:await pal(o.photo||o.thumb),src:old?old.src:'export'};msg(`Pièces ${++n}/${it.length}`)}
for(const[k,o]of Object.entries(d.outfits||{}))S.outfits[k]={pieces:o.pieces,date:o.date,city:o.city,temp:o.weatherTemp};
await save();T='p';view()}catch(e){msg('Fichier illisible : '+e.message)}}
async function addPiece(file){const src=URL.createObjectURL(file),id='m'+Date.now();S.items[id]={id,tags:$('#tg').value.split(',').map(t=>t.trim().toLowerCase().replace(/\s+/g,'-')).filter(Boolean),wears:0,wearDates:[],thumb:await thumb(src),colors:await pal(src),src:'manuel'};await save();T='g';view()}
async function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({alcove:S})],{type:'application/json'}));a.download='alcove-sauvegarde-'+new Date().toISOString().slice(0,10)+'.json';a.click();lastBk=Date.now();await kv('put','bk',lastBk);view()}
document.addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;if(e.target.id=='f')imp(f);if(e.target.id=='ph')addPiece(f)});
document.addEventListener('click',e=>{if(e.target.id=='bk')backup();if(e.target.dataset.t){T=e.target.dataset.t;view()}});
(async()=>{S.items=await kv('get','items')||{};S.outfits=await kv('get','outfits')||{};lastBk=await kv('get','bk')||0;navigator.storage&&navigator.storage.persist&&navigator.storage.persist();view()})();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
