<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Alcôve</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0d0b10"><link rel="icon" href="icon-192.png">
<style>
@font-face{font-family:Bodoni;src:url(fonts/bodoni.woff2);font-weight:400 900;font-display:swap}
@font-face{font-family:Instr;src:url(fonts/instr.woff2);font-weight:400 700;font-display:swap}
:root{--bg:#0d0b10;--cr:#f6ecda;--go:#e8c66c}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--cr);font:16px/1.55 Instr,system-ui,sans-serif;padding:env(safe-area-inset-top) 18px calc(84px + env(safe-area-inset-bottom));max-width:480px;margin:auto}

h1{font-size:2.6rem;font-weight:500;padding:24px 0 0;line-height:1;letter-spacing:.02em}h2{font-size:1.4rem;font-weight:500;color:var(--go);margin:34px 0 8px}
.mut{opacity:.65;font-size:.9rem}
.nc{margin-top:38px;border-radius:999px 999px 16px 16px;padding:70px 24px 28px;text-align:center;background:radial-gradient(ellipse 90% 60% at 50% 100%,color-mix(in srgb,var(--c) 55%,#fff 22%),transparent 72%),var(--c);box-shadow:inset 0 0 0 1.5px var(--go),0 0 0 6px var(--bg),0 0 0 7.5px color-mix(in srgb,var(--go) 60%,transparent)}

.nc svg{width:130px;height:130px;stroke:var(--go);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:color-mix(in srgb,var(--go) 14%,transparent);margin-bottom:6px}
.nc .d{font-size:2.3rem;font-weight:600;line-height:1.1;letter-spacing:.03em}.rn{font-size:4.4rem;line-height:1;color:var(--go);margin-bottom:6px}
.nc p{margin-top:8px}.nc a{color:var(--go);display:inline-block;margin-top:10px}
.pal{display:flex;justify-content:center;gap:6px;margin-bottom:12px}.pal i{width:40px;height:78px;border-radius:999px 999px 6px 6px;box-shadow:0 0 0 1.5px color-mix(in srgb,var(--go) 70%,transparent)}
.sc{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #ffffff26;text-align:left}.sc em{font-style:normal;color:var(--go);letter-spacing:2px}
.ix{display:flex;gap:8px;padding:5px 0;cursor:pointer}.ix s{flex:1;border-bottom:1px dotted #fff8;transform:translateY(-6px)}.ix.on{color:var(--go)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal b{aspect-ratio:1;border-radius:50%;border:1px solid #fff3;font-size:.62rem;font-weight:400;display:grid;place-items:center;opacity:.6}.cal b.d{border:0;opacity:1;cursor:pointer;box-shadow:0 0 0 1.5px var(--go)}
.card{border:1px solid #fff4;border-radius:16px;padding:14px;margin-top:12px}
button,label.btn{display:block;width:100%;background:var(--go);color:#1a1208;border:0;border-radius:12px;padding:12px;margin-top:10px;text-align:center;font:inherit;font-weight:600;cursor:pointer}

input{font:inherit;color:inherit;width:100%;background:none;border:0;border-bottom:1px solid #fff6;padding:9px 2px;margin-top:6px;border-radius:0}
.l{list-style:none;padding:0;margin-top:12px}.l li{padding:6px 0;border-bottom:1px solid #ffffff1f}.l a{float:right;color:var(--go);padding:0 6px;cursor:pointer}
p[data-r]{padding:6px 0;cursor:pointer}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0d0b10ee;border-top:1px solid var(--go);padding-bottom:env(safe-area-inset-bottom)}
nav button{margin:0;background:none;color:var(--cr);opacity:.6;border-radius:0;padding:15px 2px;font-weight:500}nav button.on{opacity:1;color:var(--go);box-shadow:inset 0 3px var(--go)}
</style></head><body>
<h1>Alcôve</h1><p class="mut" id="sub"></p><main id="m"></main>
<nav><button data-t="p" class="on">Alcôves</button><button data-t="j">Journal</button><button data-t="c">Collections</button><button data-t="d">Données</button></nav>
<script>
const $=s=>document.querySelector(s);
const DB=new Promise(r=>{const q=indexedDB.open('alcove',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>r(q.result)});
const kv=async(m,k,v)=>{const db=await DB;return new Promise(r=>{const s=db.transaction('kv',m=='get'?'readonly':'readwrite').objectStore('kv');const q=m=='get'?s.get(k):s.put(v,k);q.onsuccess=()=>r(q.result)})};
let S={items:{},outfits:{}},C={},CFG={},T='p',CT='livre',RS=[],lastBk=0;
const save=()=>Promise.all([kv('put','items',S.items),kv('put','outfits',S.outfits),kv('put','cult',C),kv('put','cfg',CFG)]);
const rgb=c=>`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;
const load=src=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src});
async function pal(src){const i=await load(src);if(!i)return[];const c=document.createElement('canvas');c.width=c.height=32;const x=c.getContext('2d');x.drawImage(i,0,0,32,32);const d=x.getImageData(0,0,32,32).data,b={};
for(let p=0;p<d.length;p+=4){const r=d[p],g=d[p+1],l=d[p+2];if(d[p+3]<128)continue;const mx=Math.max(r,g,l),mn=Math.min(r,g,l);if(mn>225||(mx-mn<12&&mx>215))continue;const k=[r,g,l].map(v=>v>>5).join();const a=b[k]||(b[k]=[0,0,0,0]);a[0]+=r;a[1]+=g;a[2]+=l;a[3]++}
return Object.values(b).sort((a,c)=>c[3]-a[3]).slice(0,3).map(a=>[a[0]/a[3]|0,a[1]/a[3]|0,a[2]/a[3]|0,a[3]])}
const hs=([r,g,b])=>{r/=255;g/=255;b/=255;const m=Math.max(r,g,b),n=Math.min(r,g,b),l=(m+n)/2,d=m-n;let h=0;if(d){h=m==r?((g-b)/d)%6:m==g?(b-r)/d+2:(r-g)/d+4;h=(h*60+360)%360}return[h,d?d/(1-Math.abs(2*l-1)):0,l]};
const W=' '.repeat(0),sp=s=>s.split(' ');
const CH=sp('talons escarpins formel decouvert decollete dos-nu epaules-nues pochette sac-cuir collier boucles bague bracelet pendentif pendants broche montre robe-longue veste-costume cravate noeud-pap soie dentelle paillettes brillant brillants metallique dore argente vernis');
const OU=sp('baskets tennis lunettes-soleil chapeau casquette bonnet bottes-pluie shorts bermuda espadrilles sandales sport jogging');
const SP=sp('sport baskets-sport tshirt-sport jogging maillot-natation'),PL=sp('maillot bikini pareo');
const LB={ete:'Été',heritage:'Héritage',decouvert:'Découvert',ecru:'Écru'};
const wt=i=>i.tags.some(t=>['chaussures','exterieur','accessoires','sous-vetements'].includes(t))?.12:i.tags.includes('bas')?.6:i.tags.includes('couche')?.7:1;
const kind=o=>o.sp?'Sport':o.pl?'Plage':o.ch>=4?'Soirée':o.ch>=2?'Sortie':o.ou>=2?'Plein air':'Quotidien';
const MOT=sp('fleuri vegetal rayures geometrique figuratif noeud');
function stats(){const I=Object.values(S.items);if(!I.length)return null;
const oc=Object.values(S.outfits).map(o=>{const t=new Set(o.pieces.flatMap(p=>S.items[p]?S.items[p].tags:[])),n=l=>l.filter(x=>t.has(x)).length;return{d:o.date,ch:n(CH),ou:n(OU),sp:n(SP),pl:n(PL)}});
const sh=f=>I.filter(f).length/I.length,acc={};let Wt=0,warm=0,sat=0;
I.forEach(i=>i.colors.forEach(c=>{const[h,s,l]=hs(c),w=c[3]*wt(i)*(.3+1.7*s),k=s<.18?'n'+(l>.55):'h'+Math.round(h/30)%12,a=acc[k]||(acc[k]=[0,0,0,0]);a[0]+=c[0]*w;a[1]+=c[1]*w;a[2]+=c[2]*w;a[3]+=w;Wt+=w;sat+=s*w;if(s>.18&&(h<70||h>320))warm+=w}));
const palette=Object.values(acc).sort((a,b)=>b[3]-a[3]).slice(0,5).map(a=>[a[0]/a[3],a[1]/a[3],a[2]/a[3]]);
const cl=v=>Math.max(0,Math.min(1,v)),mo=oc.length||1,el=oc.reduce((a,o)=>a+Math.min(o.ch,6)/6,0)/mo;
const K={};oc.forEach(o=>K[kind(o)]=(K[kind(o)]||0)+1);
return{n:I.length,o:oc.length,palette,I,K,el,ax:[el,oc.filter(o=>o.ou>=2||o.sp||o.pl).length/mo,Wt?cl(warm/Wt*1.6):.5,cl(sh(i=>MOT.some(t=>i.tags.includes(t)))+(Wt?sat/Wt:0)/2),sh(i=>i.tags.includes('heritage')||i.tags.includes('donne'))]}}
const F={BILLY:'<rect x="24" y="8" width="52" height="84"/><path d="M24 36h52M24 64h52"/>',KALLAX:'<rect x="12" y="12" width="76" height="76"/><path d="M37 12v76M62 12v76M12 37h76M12 62h76"/>',
'POÄNG':'<path d="M30 12c-8 22-8 42 4 60h34M30 12c14 8 26 24 30 50M34 72l-6 18M68 72l6 18"/>',EKTORP:'<rect x="10" y="40" width="80" height="34" rx="10"/><path d="M18 40V26q0-8 8-8h48q8 0 8 8v14M20 74v10M80 74v10"/>',
STOCKHOLM:'<rect x="8" y="30" width="84" height="40" rx="3"/><path d="M36 70V30M64 70V30M14 70l-3 20M86 70l3 20"/><circle cx="32" cy="50" r="2"/><circle cx="68" cy="50" r="2"/>',LACK:'<rect x="14" y="30" width="72" height="10" rx="2"/><path d="M22 40v46M78 40v46"/>'};
const AR={BILLY:[[.5,.3,.4,.2,.4],'Rangé·e, fiable, jamais à court d’étagères.','H 202 × L 80 cm · montage : 1 h'],KALLAX:[[.4,.5,.5,.5,.2],'Tout se combine, tout se range en cases.','H 147 × L 147 cm · montage : 2 h'],
'POÄNG':[[.3,.4,.6,.4,.5],'Une courbe douce, un endroit où se poser.','H 100 × L 68 cm · montage : 40 min'],EKTORP:[[.4,.3,.7,.3,.8],'Chaleur, héritage et coussins qui ont vécu.','H 88 × L 218 cm · montage : 1 h 30'],
STOCKHOLM:[[.8,.2,.5,.9,.4],'Une pièce de caractère, jamais anonyme.','H 74 × L 180 cm · montage : 3 h, clé Allen fournie'],LACK:[[.2,.7,.2,.1,.1],'Sobre, léger, s’adapte à tout.','H 45 × L 55 cm · montage : 10 min']};
const dist=(v,ax)=>v.reduce((s,x,j)=>s+(x-ax[j])**2,0);
const pick=ax=>Object.entries(AR).sort((a,b)=>dist(a[1][0],ax)-dist(b[1][0],ax))[0][0];
const RO=sp('0 I II III IV V VI VII VIII IX X XI XII XIII XIV XV XVI XVII XVIII XIX XX XXI');
const TA='Le Fou|l’élan sans plan|39591,Le Bateleur|l’art de tout combiner|63582,La Papesse|le savoir silencieux|61248,L’Impératrice|l’abondance|75965,L’Empereur|structure et tenue|92337,Le Pape|la tradition|71429,L’Amoureux|le choix du cœur|74864,Le Chariot|la marche en avant|58562,La Force|la douceur qui tient|57764,L’Ermite|la retraite lumineuse|24127,La Roue de Fortune|les cycles|55573,La Justice|l’équilibre|82326,Le Pendu|l’autre point de vue|33384,La Mort|la mue|61158,La Tempérance|le juste mélange|56535,Le Diable|le goût du désir|82692,La Maison-Dieu|la rupture qui libère|45891,L’Étoile|l’espoir|68454,La Lune|l’intuition nocturne|73276,Le Soleil|la joie franche|59953,Le Jugement|l’appel|64647,Le Monde|l’accomplissement|76665'.split(',').map(x=>x.split('|'));
const tarot=ax=>{const j=TA.map((t,i)=>[i,dist(t[2].split('').map(x=>x/9),ax)]).sort((a,b)=>a[1]-b[1])[0][0];return[RO[j],TA[j][0],'Arcane majeure · '+TA[j][1]]};
const AE={Cottagecore:'fleuri vegetal lin coton jupe-ample robe tunique','Dark academia':'brun noir laine velours cote bordeaux veste',Y2K:'brillant paillettes crop-top rose metallique brillants',Coquette:'noeud dentelle rose ecru ballerines ajoure',Minimaliste:'noir blanc gris beige pantalon-fluide lin'};
const SEA={printemps:'Printemps',ete:'Été',automne:'Automne',hiver:'Hiver'};
const nc=(c,k,ill,t,b)=>`<section class="nc" style="--c:${c}"><small>${k}</small>${ill}<div class="d">${t}</div><p>${b}</p></section>`;
const IC={el:'<path d="M30 14h40c0 24-8 36-20 38C38 50 30 38 30 14zM50 52v30M34 86h32"/>',ae:'<circle cx="50" cy="50" r="30"/><circle cx="50" cy="50" r="14"/><path d="M50 20v60M20 50h60M29 29l42 42M71 29L29 71"/>',se:'<circle cx="50" cy="50" r="16"/><path d="M50 12v14M50 74v14M12 50h14M74 50h14M23 23l10 10M67 67l10 10M77 23L67 33M33 67L23 77"/>',er:'<path d="M30 12h40M30 88h40M34 12c0 28 32 24 32 38S34 60 34 88M66 12c0 28-32 24-32 38"/>'};
const dayCol=d=>{let a=[0,0,0],w=0;Object.values(S.outfits).filter(o=>o.date==d).forEach(o=>o.pieces.forEach(p=>{const i=S.items[p];if(i&&i.colors[0]){const x=wt(i);[0,1,2].forEach(j=>a[j]+=i.colors[0][j]*x);w+=x}}));return w?rgb(a.map(v=>v/w)):null};
const plab=id=>{const i=S.items[id];return i?i.tags.filter(t=>!['haut','bas','une-piece','couche','exterieur','chaussures','accessoires','ch-ouvertes','ch-fermees','ch-informelles','autres','poches'].includes(t)).slice(0,2).map(t=>(LB[t]||t).replace(/-/g,' ')).join(' '):''};
function cal(){const ms=[...new Set(Object.values(S.outfits).map(o=>o.date.slice(0,7)))].sort();return ms.map(k=>{const[y,m]=k.split('-').map(Number),n=new Date(y,m,0).getDate(),off=(new Date(y,m-1,1).getDay()+6)%7;
return`<h2>${new Date(y,m-1,1).toLocaleDateString('fr',{month:'long',year:'numeric'})}</h2><div class="cal">${'<i></i>'.repeat(off)}${Array.from({length:n},(_,j)=>{const d=`${k}-${String(j+1).padStart(2,'0')}`,c=dayCol(d);return c?`<b class="d" data-d="${d}" style="background:${c}"></b>`:`<b>${j+1}</b>`}).join('')}</div>`}).join('')}
function view(){const m=$('#m'),s=stats();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==T));
$('#sub').textContent=s?`${s.n} pièces · ${s.o} tenues · ${Object.keys(C).length} œuvres et médias`:'Vos alcôves culturelles';
if(T=='d')return m.innerHTML=data();if(T=='c')return m.innerHTML=coll();
if(!s)return m.innerHTML='<div class="card"><p>Alcôves vides. Importez l’export JSON de votre garde-robe dans Données.</p></div>';
if(T=='j')return m.innerHTML=`<p class="mut" id="dt" style="margin-top:14px">Touchez un jour pour voir la tenue.</p>${cal()}`;
const k=pick(s.ax),tr=tarot(s.ax),ys=Object.values(C).map(e=>+e.year).filter(y=>y>1000);
const ae=Object.entries(AE).map(([n,t])=>[n,s.I.reduce((a,i)=>a+sp(t).filter(x=>i.tags.includes(x)).length/3,0)]).sort((a,b)=>b[1]-a[1]);
const se=Object.entries(SEA).map(([q,l])=>[l,s.I.filter(i=>i.tags.includes(q)).length]).sort((a,b)=>b[1]-a[1])[0];
const rows=Object.entries(s.K).sort((a,b)=>b[1]-a[1]).map(([a,n])=>`<div class="sc">${a}<em>${'●'.repeat(Math.min(n,10))} ${n}</em></div>`).join('');
m.innerHTML=nc('#14503f','Votre meuble',`<svg viewBox="0 0 100 100">${F[k]}</svg>`,k,`${AR[k][1]}<br><span class="mut">${AR[k][2]}</span><br><a href="https://www.ikea.com/fr/fr/search/?q=${encodeURIComponent(k)}" target="_blank">Voir sur ikea.fr</a>`)
+nc('#4a1230','Votre arcane',`<div class="rn">${tr[0]}</div>`,tr[1],tr[2])
+nc('#1d2a63','Votre palette',`<div class="pal">${s.palette.map(c=>`<i style="background:${rgb(c)}"></i>`).join('')}</div>`,'Palette','Hauts et robes en premier ; chaussures et manteaux allégés.')
+nc('#5b1d5e','Élégance',`<svg viewBox="0 0 100 100">${IC.el}</svg>`,Math.round(s.el*100)+' %',`<span class="mut">Vos jours, d’après les tags</span><div style="margin-top:8px">${rows}</div>`)
+nc('#0f4f5c','Aesthetic',`<svg viewBox="0 0 100 100">${IC.ae}</svg>`,ae[0][0],'puis '+ae[1][0])
+nc('#8a4b12','Saison',`<svg viewBox="0 0 100 100">${IC.se}</svg>`,se[1]?se[0]:'—','saison dominante de la garde-robe')
+nc('#2b2f55','Ère culturelle',`<svg viewBox="0 0 100 100">${IC.er}</svg>`,ys.length?'Vers '+Math.round(ys.reduce((a,b)=>a+b)/ys.length/10)*10:'—',ys.length?'année moyenne de vos œuvres et films':'renseignez des années dans Collections')}
const TY=[['livre','Livres'],['film','Films'],['serie','Séries'],['musique','Musique'],['oeuvre','Œuvres'],['monument','Monuments'],['spectacle','Spectacles']];
function coll(){const n=t=>Object.values(C).filter(e=>e.type==t).length;
return`<h2>Index</h2>${TY.map(([t,l])=>`<div class="ix${t==CT?' on':''}" data-ct="${t}">${l}<s></s>${n(t)}</div>`).join('')}
<h2>${TY.find(x=>x[0]==CT)[1]}</h2><div class="card"><input id="q" placeholder="Titre ou nom"><input id="yr" placeholder="Année (facultatif)" inputmode="numeric"><button id="sr">Chercher (Wikidata)</button><button class="alt" id="ad">Ajouter tel quel</button><div id="rs"></div></div>
<ul class="l">${Object.values(C).filter(e=>e.type==CT).map(e=>`<li>${e.title}${e.by?' — '+e.by:''}${e.year?' ('+e.year+')':''}<br><span class="mut">${[e.g,e.d].filter(Boolean).join(' · ')}</span><a data-x="${e.id}">×</a></li>`).join('')}</ul>`}
async function addC(e){if(Object.values(C).some(x=>x.type==e.type&&x.title.toLowerCase()==e.title.toLowerCase()))return;const id='c'+Date.now()+Math.random().toString(36).slice(2,5);C[id]={id,...e};await save()}
async function srch(){const q=$('#q').value.trim();if(!q)return;$('#rs').textContent='…';try{const r=await(await fetch(`https://www.wikidata.org/w/api.php?action=wbsearchentities&search=${encodeURIComponent(q)}&language=fr&uselang=fr&limit=6&format=json&origin=*`)).json();RS=r.search||[];$('#rs').innerHTML=RS.map((x,i)=>`<p data-r="${i}">• <b>${x.label}</b> <span class="mut">${x.description||''}</span></p>`).join('')||'Aucun résultat.'}catch(e){$('#rs').textContent='Recherche indisponible.'}}
function data(){const old=lastBk&&Date.now()-lastBk>2.6e9;return`<h2>Garde-robe</h2><div class="card"><p class="mut">Export JSON : fusionné, rien n’est supprimé. Les photos ne servent qu’à extraire les couleurs.</p><label class="btn">Importer le JSON<input type="file" accept=".json" id="f" hidden></label><p class="mut" id="msg"></p><input id="tg" placeholder="Ajouter une pièce : tags (robe, bleu, lin)"><label class="btn alt">Photo de la pièce<input type="file" accept="image/*" capture="environment" id="ph" hidden></label></div>
<h2>Films et musique</h2><div class="card"><input id="bu" placeholder="Letterboxd : nom d’utilisateur" value="${CFG.bu||''}"><button class="alt" id="lbs">Synchroniser Letterboxd (flux RSS)</button><label class="btn alt">Historique complet : CSV Letterboxd<input type="file" accept=".csv" id="lb" hidden></label><input id="lu" placeholder="Last.fm : nom d’utilisateur" value="${CFG.lu||''}"><input id="lk" placeholder="Last.fm : clé d’API" value="${CFG.lk||''}"><button class="alt" id="ls">Synchroniser Last.fm</button><p class="mut" id="msg2"></p></div>
<h2>Sauvegarde</h2><div class="card"><p class="mut">${lastBk?(old?'Dernière sauvegarde il y a plus d’un mois. ':'Dernière : '+new Date(lastBk).toLocaleDateString('fr')+'. '):'Aucune sauvegarde. '}Vos données ne vivent que sur ce téléphone.</p><button id="bk">Sauvegarder</button></div>`}
const msg=t=>{const e=$('#msg');if(e)e.textContent=t},msg2=t=>{const e=$('#msg2');if(e)e.textContent=t};
async function imp(file){try{msg('Lecture…');const d=JSON.parse(await file.text());
if(d.alcove){S=d.alcove;C=d.cult||{};await save();T='p';return view()}
const it=d.items||[];let n=0;
for(const o of it){const old=S.items[o.id];S.items[o.id]={id:o.id,tags:o.tags||[],wears:o.wears||0,wearDates:o.wearDates||[],colors:old&&old.colors.length?old.colors:await pal(o.photo||o.thumb),src:old?old.src:'export'};msg(`Pièces ${++n}/${it.length}`)}
for(const[k,o]of Object.entries(d.outfits||{}))S.outfits[k]={pieces:o.pieces,date:o.date,city:o.city,temp:o.weatherTemp};
await save();T='p';view()}catch(e){msg('Fichier illisible : '+e.message)}}
async function addPiece(f){const id='m'+Date.now();S.items[id]={id,tags:$('#tg').value.split(',').map(t=>t.trim().toLowerCase().replace(/\s+/g,'-')).filter(Boolean),wears:0,wearDates:[],colors:await pal(URL.createObjectURL(f)),src:'manuel'};await save();T='p';view()}
const csv=t=>{const R=[];let r=[],c='',q=0;for(let i=0;i<t.length;i++){const h=t[i];if(q){if(h=='"'&&t[i+1]=='"'){c+='"';i++}else if(h=='"')q=0;else c+=h}else if(h=='"')q=1;else if(h==','){r.push(c);c=''}else if(h=='\n'){r.push(c.replace(/\r$/,''));R.push(r);r=[];c=''}else c+=h}if(c||r.length){r.push(c);R.push(r)}return R};
async function lb(f){const R=csv(await f.text()),h=R[0],ni=h.indexOf('Name'),yi=h.indexOf('Year');let n=0;for(const r of R.slice(1))if(r[ni]){await addC({type:'film',title:r[ni],year:r[yi],d:'Letterboxd',src:'letterboxd'});n++}msg2(n+' films lus.')}
async function lbs(){CFG.bu=$('#bu').value.trim();await save();msg2('…');try{const x=await(await fetch('/api/proxy?u='+encodeURIComponent(`https://letterboxd.com/${CFG.bu}/rss/`))).text(),d=new DOMParser().parseFromString(x,'text/xml');let n=0;
for(const it of d.getElementsByTagName('item')){const g=k=>{const e=it.getElementsByTagName(k)[0];return e?e.textContent:''};if(g('letterboxd:filmTitle')){await addC({type:'film',title:g('letterboxd:filmTitle'),year:g('letterboxd:filmYear'),d:'Letterboxd'+(g('letterboxd:memberRating')?' · '+g('letterboxd:memberRating')+'★':''),src:'letterboxd'});n++}}msg2(n+' films du flux (les ~50 derniers du journal).')}catch(e){msg2('Échec : '+e.message)}}
const LF=(m,x)=>fetch(`https://ws.audioscrobbler.com/2.0/?method=${m}&api_key=${CFG.lk}&format=json&${x}`).then(r=>r.json());
async function lfs(){CFG.lu=$('#lu').value.trim();CFG.lk=$('#lk').value.trim();await save();msg2('…');try{const u='&user='+encodeURIComponent(CFG.lu),G={};
const t=await LF('user.gettoptracks','limit=100&period=overall'+u),a=await LF('user.gettopalbums','limit=50&period=overall'+u);
for(const x of t.toptracks.track)await addC({type:'musique',title:x.name,by:x.artist.name,d:x.playcount+' écoutes',src:'lastfm'});
for(const x of a.topalbums.album)await addC({type:'musique',title:x.name,by:x.artist.name,d:'album · '+x.playcount+' écoutes',src:'lastfm'});
for(const n of[...new Set(t.toptracks.track.map(x=>x.artist.name))].slice(0,15)){const r=await LF('artist.gettoptags','artist='+encodeURIComponent(n));G[n]=(r.toptags.tag||[]).slice(0,2).map(z=>z.name).join(', ')}
Object.values(C).forEach(e=>{if(e.src=='lastfm'&&G[e.by])e.g=G[e.by]});await save();msg2('Last.fm synchronisé.')}catch(e){msg2('Échec : clé, nom, ou service refusant le navigateur ('+e.message+').')}}
async function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({alcove:S,cult:C})],{type:'application/json'}));a.download='alcove-sauvegarde-'+new Date().toISOString().slice(0,10)+'.json';a.click();lastBk=Date.now();await kv('put','bk',lastBk);view()}
document.addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;({f:imp,ph:addPiece,lb}[e.target.id]||(()=>0))(f)});
document.addEventListener('click',async e=>{const t=e.target,d=t.dataset,id=t.id;
if(d.t){T=d.t;view()}else if(d.ct){CT=d.ct;view()}else if(id=='bk')backup();else if(id=='sr')srch();else if(id=='lbs')lbs();else if(id=='ls')lfs();
else if(id=='ad'){const q=$('#q').value.trim();if(q){await addC({type:CT,title:q,year:$('#yr').value,src:'manuel'});view()}}
else if(d.x){delete C[d.x];await save();view()}
else if(t.closest('[data-r]')){const x=RS[t.closest('[data-r]').dataset.r];await addC({type:CT,title:x.label,year:$('#yr').value,d:x.description,src:'wikidata'});view()}
else if(d.d){const o=Object.values(S.outfits).filter(o=>o.date==d.d);$('#dt').textContent=new Date(d.d).toLocaleDateString('fr',{day:'numeric',month:'long'})+(o[0]&&o[0].temp?' · '+o[0].temp+' °C':'')+' : '+o.flatMap(o=>o.pieces.map(plab)).filter(Boolean).join(', ')}});
(async()=>{S.items=await kv('get','items')||{};S.outfits=await kv('get','outfits')||{};C=await kv('get','cult')||{};CFG=await kv('get','cfg')||{};lastBk=await kv('get','bk')||0;Object.values(S.items).forEach(i=>delete i.thumb);navigator.storage&&navigator.storage.persist&&navigator.storage.persist();view()})();
